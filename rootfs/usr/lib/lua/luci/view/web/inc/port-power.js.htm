<script type="text/tmpl" id="portList">
	{for(var i=0, len=$list.length; i<len; i++)}
        {if ($list[i]['service'] != 'WAN' && $list[i]['power'] >= 0)}
        <div {if ($list[i]['power'] == '1' && $list[i]['pwrRate'] != '0')} class="listDiv active" {else} class="listDiv" {/if} data-service="{$list[i]['service']}" data-port="{$list[i]['port']}" data-speed="{$list[i]['speed']}">
        {else}
        <div class="listDiv disable" data-service="{$list[i]['service']}" data-port="{$list[i]['port']}" data-speed="{$list[i]['speed']}">
        {/if}
            {if ($list[i]['power'] < 0)}
            <div class="service">{$list[i]['service']}</div>
            {else}
            <div class="service">{$list[i]['pwrRate']}W</div>
            {/if}
            <div class="lanPortImg"></div>
            <div class="portsIndex">{$list[i]['label']}</div>
            {if ( $list[i]['service'] != 'WAN' && $list[i]['power'] >= 0)}
            <div class="switch" style="margin-top:5px">
                {if ($list[i]['power'] == 1)}
                <a href="#" class="powerSwitch btn-switch btn-switch-on" data-on="{$list[i].power}"></a>
                {else}
                <a href="#" class="powerSwitch btn-switch btn-switch-off" data-on="{$list[i].power}"></a>
                {/if}
            </div>
            {/if}
        </div>
	{/for}
</script>
<script>
    //获取网口信息
    $.sub( 'getPowerPortInfo', function(){
        $.getJSON('<%=luci.dispatcher.build_url("api","misystem","get_ps_map")%>').done(function(rsp){
                if( rsp.code == 0 ){
                    var arr = []
                    list = rsp.ports
                    serviceTranslations = {
                        "聚合口": "<%:聚合口%>",
                        "游戏网口": "<%:游戏网口%>"
                    };
                    for(var i = 0; i < list.length; i++){
                        var item = {
                            index:list[i].index,
                            service:serviceTranslations[list[i].service] || list[i].service,
                            speed:list[i].speed,
                            port:list[i].port,
                            label:list[i].label,
                            power: list[i].power, //供电端口状态
                            pwrRate:list[i].PwrRate,
                        }
                        arr.push(item)
                    }

                    var tplData = {
                        list:arr
                    }

                    tpl = $('#portList').html()
                    $(".powerPort").html( tpl.tmpl(tplData) );
                    setTimeout(function(){
                        $.pub('getPowerPortInfo')
                    }, 5000)
                }
            })
    } );
    //供电网口开关点击
    $(document).on('click', '.powerSwitch', function(e){
        e.preventDefault();
        var $this = $(this);
        var port = $this.parents().parents(".listDiv").data('port');
        var on = $this.data('on');

        $.ajax({
            url: '<%=luci.dispatcher.build_url("api", "misystem","set_port_power")%>',
            type: "POST",
            dataType: 'json',
            data: {
                port: port,
                power: on == 0 ? 1 : 0
            },
            success: function(res) {
                if(res.code === 0) {
                    if( on == 0 ){
                        $this.removeClass('btn-switch-off').addClass('btn-switch-on');
                        $this.data('on', 1);
                        //$this.parent().parent('.listDiv').addClass("active");
                    }else{
                        $this.removeClass('btn-switch-on').addClass('btn-switch-off');
                        $this.data('on', 0);
                        //$this.parent().parent('.listDiv').removeClass("active");
                    }
                }else{
                    $.alert('<%:设置失败%>');
                }
            }
        });
    });
    $.pub('getPowerPortInfo')
</script>
