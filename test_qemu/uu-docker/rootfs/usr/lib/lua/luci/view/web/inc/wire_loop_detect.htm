<div class="mod-set">
    <div class="hd">
        <h3><%:环路检测%></h3>
        <div class="switch">
            <a href="#" id="wldswitch" class="btn-switch btn-switch-off" data-on="0"></a>
        </div>
    </div>
    <div class="bd">
        <div>
            <p><%:检测到网口接入环境存在环路时，将关闭该网口，并在5分钟后恢复网口正常使用。如环路继续存在，将继续关闭网口，周期检测至环路解除%></p>
        </div>
    </div>
</div>

<script>
    function getWireLoopDetect() {
        $.ajax({
            url: '<%=luci.dispatcher.build_url("api", "misystem", "get_wire_loop_detect")%>',
            type: 'GET',
            datatype: 'json',
            async: true,
            success: function( rsp ){
                rsp = $.parseJSON(rsp);
                if (rsp.code === 0) {
                    if (rsp.status == 1) {
                        $("#wldswitch").removeClass("btn-switch-off")
                        .addClass("btn-switch-on")
                        .attr("data-on", "1");
                    }
                    else {
                        $("#wldswitch").removeClass("btn-switch-on")
                        .addClass("btn-switch-off")
                        .attr("data-on", "0");
                    }
                }
            }
        });
    }
    function setWireLoopDetect() {
        var on = $("#wldswitch").attr("data-on") == "0" ? 1 : 0,
            requestData = {on:on};

        $.ajax({
            url: '<%=luci.dispatcher.build_url("api", "misystem", "set_wire_loop_detect")%>',
            type: 'POST',
            datatype: 'json',
            data: requestData,
            async: true,
            success: function( rsp ){
                rsp = $.parseJSON(rsp);
                if (rsp.code === 0) {
                    if (on == 1) {
                        $("#wldswitch").removeClass("btn-switch-off")
                        .addClass("btn-switch-on")
                        .attr("data-on", "1");
                    }
                    else {
                        $("#wldswitch").removeClass("btn-switch-on")
                        .addClass("btn-switch-off")
                        .attr("data-on", "0");
                    }
                }
            }
        });
    }

    $('body').on('click', '#wldswitch', function(e) {
        e && e.preventDefault();
        setWireLoopDetect();
    })
    getWireLoopDetect()
    
</script>
