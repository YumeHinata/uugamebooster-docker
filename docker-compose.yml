# ── QEMU NX30Pro uuplugin — 生产部署 ────────────────────────────────────────
# 从 Docker Hub 拉取预构建镜像，运行 aarch64 uuplugin + guardian
#
# 前置条件（路由器上一次性执行）:
#   echo ':qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:OCF' > /proc/sys/fs/binfmt_misc/register
#
# Usage:
#   docker compose pull           # 拉取最新镜像
#   docker compose up -d          # 后台启动
#   docker compose down           # 停止并清理
#   docker logs UUgamebooster     # 查看日志
#   docker exec -it UUgamebooster sh  # 进入调试
#
# 环境变量（可选覆盖）:
#   UU_SN=xxx       设备序列号（默认从 MAC 生成）
#   UU_STRACE=1     启用 strace 调试
#   UU_DEBUG=1      详细日志输出

services:

  uuplugin:
    image: docker.io/yumehinata/uugamebooster-docker:main
    pull_policy: always
    container_name: UUgamebooster
    restart: unless-stopped
    network_mode: host
    environment:
      - UU_STRACE=${UU_STRACE:-0}
      - UU_DEBUG=${UU_DEBUG:-0}
      - UU_SN=${UU_SN:-}
    cap_add:
      - NET_ADMIN           # iptables, nftables, ip rule
      - NET_RAW             # raw socket (conntrack)
      - SYS_PTRACE          # strace 调试
      - SYS_ADMIN           # tun/tap 设备创建
    volumes:
      - /usr/sbin/nft:/usr/sbin/nft.host:ro
    devices:
      - /dev/net/tun:/dev/net/tun
