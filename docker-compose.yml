version: "3.8"

services:
  uuplugin:
    image: yumehinata/uugamebooster-docker:latest
    # build: .   # Uncomment to build locally instead of pulling image
    container_name: UUgamebooster
    restart: unless-stopped

    # ── Network privileges (acceleration core requirements) ──
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
      - SYS_NICE
    devices:
      - /dev/net/tun:/dev/net/tun

    # ── Host networking (iptables rules apply directly to host) ──
    network_mode: host

    # ── Identity spoofing for H3C full-feature activation ──
    environment:
      - UU_MODEL=h3c-nx30pro
      - UU_VENDOR=h3c
      # - FIXED_SN=    # Uncomment to bind a persistent SN

    # ── Log rotation ──
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
