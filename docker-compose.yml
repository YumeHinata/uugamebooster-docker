version: "3.8"

services:
  uuplugin:
    image: yumehinata/uugamebooster-docker:main   # Pull from Docker Hub
    # build: .   # Or build locally if you have the repo cloned
    container_name: UUgamebooster
    hostname: NX30Pro
    restart: unless-stopped

    # ── Full privileges: binary writes to /proc/sys (tcp_mtu_probing etc.) ──
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun

    # ── Host networking (iptables rules apply directly to host) ──
    network_mode: host

    # ── Host filesystem mounts (device discovery) ──
    volumes:
      # DHCP lease file: binary reads this to discover LAN devices (PC/phone/console)
      - /tmp/dhcp.leases:/tmp/dhcp.leases:ro

    # ── All env vars required by uuplugin (getenv() must not return NULL) ──
    environment:
      # Device identity
      - UU_MODEL=h3c-nx30pro
      - UU_VENDOR=h3c
      - UU_DEVICE_TYPE=router
      - UU_FIRMWARE_VERSION=v14.3.0
      # SN is auto-generated & persisted internally (see start.sh)
      - UU_PLUGIN_VESION=v14.3.0
      - UU_RANDOM=default
      # Network interfaces (populated at runtime but must be non-null)
      - UU_DEVICE_MAC=00:00:00:00:00:00
      - UU_DEVICE_IP=127.0.0.1
      - UU_DEVICE_FWMARK=0
      - UU_DEVICE_LINK_TYPE=ethernet
      - UU_LAN_IP=192.168.0.1
      - UU_LAN_NAME=br-lan
      - UU_WAN_IP=0.0.0.0
      - UU_TUN_IP=10.0.0.1
      - UU_TUN_NAME=tun163
      - UU_ROUTE_DEFAULT_TABLE=main
      - UU_ROUTE_FWMARK_TABLE=163
      - UU_N_PR_H=0
      # Standard
      - HOME=/root
      - TZ=CST-8
      # Override host HOSTNAME (iStoreOS→NX30Pro) — binary reads this as OS identifier!
      - HOSTNAME=NX30Pro
      # Debug: strace capture enabled
      - STRACE_DEBUG=0
      # SSLKEYLOGFILE for Wireshark TLS decryption (MITM fallback)
      - SSLKEYLOGFILE=/tmp/sslkeys.log
      # MITM proxy: SET TO YOUR WINDOWS LAN IP (run uu_mitm_mod.py on Windows first!)
      # Router → MITM(Windows:16000) → UU Server(106.2.95.34:16000)
      - UU_MITM_HOST=192.168.0.247
      # Skip start.sh DNS hijack when using MITM (set with UU_MITM_HOST)
      # - SKIP_DNS_HIJACK=1

    # ── Log rotation ──
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
