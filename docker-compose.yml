name: uugamebooster

services:
  uuplugin:
    image: yumehinata/uugamebooster-docker:main
    container_name: UUgamebooster
    restart: unless-stopped

    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host

    volumes:
      - /sys/class/net:/sys/class/net:ro

    ulimits:
      nofile:
        soft: 1024
        hard: 1024
