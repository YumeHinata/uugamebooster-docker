version: "3.8"

services:
  uuplugin:
    build: .
    container_name: uuplugin
    restart: unless-stopped
    # ── 网络权限（加速核心依赖） ──
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    # ── 使用宿主机网络栈（iptables 规则直接生效于宿主机） ──
    network_mode: host
    # ── 环境变量 ──
    environment:
      - QEMU_DEBUG=1          # 设为1开启QEMU调试日志，稳定后改为0
    # ── 日志限制 ──
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
