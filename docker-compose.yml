version: "3.8"

services:
  uuplugin:
    image: yumehinata/uugamebooster-docker:main
    container_name: UUgamebooster
    hostname: NX30Pro
    restart: unless-stopped

    privileged: true
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host

    environment:
      - UU_LAN_IP=192.168.0.1
      - UU_LAN_NAME=br-lan

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
